    <!-- Global Third-Party SDK Error Guard -->
    <script>
      (function() {
        function isDomainMismatchError(err) {
          if (!err) return false;
          const msg = typeof err === 'string' ? err : (err.message || err.reason || String(err));
          return msg.includes('maps-ashen-rho') || msg.includes('Can only be used on') || msg.includes('OneSignal');
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isDomainMismatchError(event.reason)) {
            event.preventDefault();
            console.warn('[SDK Origin Guard] Handled third-party domain mismatch:', event.reason);
          }
        });
        window.addEventListener('error', function(event) {
          if (isDomainMismatchError(event.error) || isDomainMismatchError(event.message)) {
            event.preventDefault();
            console.warn('[SDK Origin Guard] Handled third-party error event:', event.message);
          }
        });
      })();
    </script>

    <!-- OneSignal Push Notifications SDK v16 (conditioned on allowed origin) -->

        if (isSupportedDomain) {

          document.head.appendChild(script);

          });
        } else {
          console.info('[OneSignal] Push SDK bypassed on non-production origin:', window.location.origin);
